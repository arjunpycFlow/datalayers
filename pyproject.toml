[project]
name = "inocras-datalayers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
data-loader = "data_loader.cli:main"
silver-builder = "silver_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_loader", "silver_builder"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
